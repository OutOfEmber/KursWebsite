<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Invisible Loft | Главная</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <header>
        <div class="logo font-bold text-2xl">INVISIBLE <span class="text-blue-600">LOFT</span></div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="catalog.html">Каталог</a>
            <a href="stores.html">Магазины</a>
            <a href="about.html">О нас</a>
            <a href="cart.html" class="relative">🛒 Корзина <span id="cart-count" class="bg-red-500 text-white text-xs rounded-full px-1.5 absolute -top-2 -right-3">0</span></a>
            <a href="admin.html" id="adm-link" class="hidden text-blue-600">Админка</a>
        </nav>
    </header>

    <section class="py-20 text-center bg-white">
        <h1 class="text-5xl font-black mb-6">Двери, которые создают стиль</h1>
        <p class="text-gray-500 text-xl mb-8">Премиальные решения для вашего интерьера с доставкой напрямую.</p>
        <a href="catalog.html" class="btn btn-primary text-lg">Перейти в каталог</a>
    </section>
    <script src="auth-ui.js"></script>
    <script>
        // Проверка прав и обновление корзины
        if(localStorage.getItem('role') === 'admin') document.getElementById('adm-link').classList.remove('hidden');
        document.getElementById('cart-count').innerText = JSON.parse(localStorage.getItem('cart') || '[]').length;
    </script>
</body>
</html>
