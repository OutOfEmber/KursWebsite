<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invisible Loft | Главная</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="bg-white">

    <header class="main-header">
        <div class="logo" onclick="location.href='index.html'">INVISIBLE <span>LOFT</span></div>
        <nav class="nav-menu">
            <a href="index.html" class="nav-link active">Главная</a>
            <a href="catalog.html" class="nav-link">Каталог</a>
            <a href="stores.html" class="nav-link">Магазины</a>
            <a href="about.html" class="nav-link">О нас</a>
            <a href="cart.html" class="nav-link relative">
                🛒 Корзина <span id="cart-count" class="bg-red-500 text-white text-[10px] rounded-full px-1.5 absolute -top-2 -right-3">0</span>
            </a>
            <a href="admin.html" id="adm-link" class="nav-link admin hidden">Админка</a>
            <a href="login.html" id="login-link" class="nav-link">Вход</a>
            <a href="#" id="logout-btn" onclick="logout()" class="nav-link logout" style="display:none">Выйти</a>
        </nav>
    </header>

    <nav class="breadcrumbs">
        <span>Главная</span>
    </nav>

    <main class="hero">
        <h1 class="hero-title">Двери, которые создают стиль</h1>
        <p class="hero-subtitle">Премиальные решения для вашего интерьера с доставкой напрямую.</p>
        <a href="catalog.html" class="btn-hero">Перейти в каталог</a>
    </main>

    <script>
        // --- ФУНКЦИЯ СИНХРОНИЗАЦИИ UI (Копия из catalog.html) ---
        function syncAuthUI() {
            const role = localStorage.getItem('role');
            const loginLink = document.getElementById('login-link');
            const admLink = document.getElementById('adm-link');
            const logoutBtn = document.getElementById('logout-btn');

            if (role) {
                if (loginLink) loginLink.style.display = 'none';
                if (logoutBtn) logoutBtn.style.display = 'block';
                
                if (role === 'ADMIN' && admLink) {
                    admLink.classList.remove('hidden');
                    admLink.style.display = 'block';
                }
            } else {
                if (loginLink) loginLink.style.display = 'block';
                if (admLink) admLink.style.display = 'none';
                if (logoutBtn) logoutBtn.style.display = 'none';
            }
        }

        // --- ФУНКЦИЯ ОБНОВЛЕНИЯ КОРЗИНЫ (Копия из catalog.html) ---
        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const countEl = document.getElementById('cart-count');
            if (countEl) {
                countEl.innerText = cart.length;
            }
        }

        // --- ВЫХОД ---
        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        // Запуск при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => {
            syncAuthUI();
            updateCartCount();
        });
    </script>

</body>
</html>
