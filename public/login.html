<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Invisible Loft</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-6">

    <div class="bg-white p-10 md:p-14 rounded-[3.5rem] shadow-sm border border-gray-100 w-full max-w-md relative">
        
        <a href="index.html" class="absolute top-8 left-8 text-gray-300 hover:text-blue-600 transition flex items-center gap-2 text-xs font-black uppercase tracking-widest">
            ← На главную
        </a>

        <div class="text-center mb-10 mt-6">
            <h1 class="text-4xl font-black text-slate-900 mb-3">Авторизация</h1>
            <p class="text-gray-400 text-sm font-medium">Войдите для управления вашими заказами</p>
        </div>

        <div id="login-form" class="space-y-4">
            <div class="space-y-1">
                <input type="email" id="email" placeholder="Email" 
                       class="w-full p-5 bg-slate-50 border-none rounded-3xl outline-none focus:ring-2 ring-blue-100 transition text-slate-700 font-medium">
            </div>
            
            <div class="space-y-1">
                <input type="password" id="password" placeholder="Пароль" 
                       class="w-full p-5 bg-slate-50 border-none rounded-3xl outline-none focus:ring-2 ring-blue-100 transition text-slate-700 font-medium">
            </div>

            <div class="pt-4">
                <p class="text-[10px] text-gray-400 mb-2 ml-4 uppercase font-black tracking-[0.2em]">Код доступа (для админов)</p>
                <input type="text" id="adminCode" placeholder="SECRET" 
                       class="w-full p-5 bg-slate-50 border-none rounded-3xl outline-none focus:ring-2 ring-blue-100 transition text-slate-700 font-medium italic">
            </div>

            <div class="pt-6 space-y-3">
                <button onclick="auth('login')" 
                        class="w-full bg-slate-900 text-white py-5 rounded-[2rem] font-black hover:bg-blue-600 shadow-xl shadow-blue-100 transition-all active:scale-95">
                    Войти
                </button>
                <button onclick="auth('register')" 
                        class="w-full bg-white text-slate-400 py-4 rounded-[2rem] font-bold hover:text-slate-900 transition border border-transparent hover:border-gray-100">
                    Создать новый аккаунт
                </button>
            </div>
        </div>

        <div id="already-logged" class="hidden text-center py-10">
            <div class="w-16 h-16 bg-green-50 text-green-500 rounded-full flex items-center justify-center mx-auto mb-6 text-2xl">✓</div>
            <p class="text-slate-900 font-black text-xl mb-2">Вы уже в системе</p>
            <p class="text-gray-400 text-sm mb-8">Вы можете перейти к покупкам или выйти из профиля</p>
            
            <div class="space-y-3">
                <a href="catalog.html" class="block w-full bg-blue-600 text-white py-5 rounded-[2rem] font-black hover:bg-blue-700 transition">В каталог</a>
                <button onclick="logout()" class="w-full text-red-400 py-2 text-sm font-bold hover:text-red-600 transition">Выйти из аккаунта</button>
            </div>
        </div>
    </div>

    <script>
    const API = "http://localhost:5000/api/user";

    function checkStatus() {
        const token = localStorage.getItem('token');
        if (token) {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('already-logged').classList.remove('hidden');
        }
    }

    async function auth(type) {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const adminCode = document.getElementById('adminCode').value;

        if (!email || !password) return alert("Заполните поля!");

        const url = type === 'login' ? `${API}/login` : `${API}/registration`;

        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, adminCode })
            });

            const data = await res.json();

            if (res.ok) {
                // СОХРАНЯЕМ ID ТУТ
                localStorage.setItem('token', data.token);
                localStorage.setItem('role', data.role);
                localStorage.setItem('userId', data.id); 
                localStorage.setItem('userEmail', email);

                alert("Успешно!");
                window.location.href = 'index.html';
            } else {
                alert(data.error || "Ошибка");
            }
        } catch (e) {
            alert("Сервер не доступен");
        }
    }

    function logout() {
        localStorage.clear();
        window.location.reload();
    }

    checkStatus();
</script>
</body>
</html>
