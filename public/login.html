<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход | Invisible Loft</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center">Авторизация</h2>
        <div class="space-y-4">
            <input type="email" id="email" placeholder="Email" class="w-full p-3 border rounded-xl">
            <input type="password" id="pass" placeholder="Пароль" class="w-full p-3 border rounded-xl">
            <input type="text" id="adminCode" placeholder="Код приглашения (необязательно)" class="w-full p-3 border rounded-xl">
            <button onclick="auth('login')" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">Войти</button>
            <button onclick="auth('register')" class="w-full border border-blue-600 text-blue-600 py-3 rounded-xl font-bold hover:bg-blue-50 transition">Зарегистрироваться</button>
        </div>
        <a href="index.html" class="block text-center mt-6 text-gray-400 text-sm hover:underline">На главную</a>
    </div>
    <script src="auth-ui.js"></script>
    <script>
        const API = "http://localhost:5000/api";
        async function auth(type) {
            const res = await fetch(`${API}/auth/${type}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    password: document.getElementById('pass').value,
                    adminCode: document.getElementById('adminCode').value,
                    FIO: "Пользователь"
                })
            });
            const data = await res.json();
            if (data.token) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('role', data.role);
                localStorage.setItem('fio', data.fio);
                location.href = 'index.html';
            } else { alert(data.error || 'Успешно'); }
        }
    </script>
</body>
</html>
