<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Наши магазины | Invisible Loft</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

    <header id="header-placeholder"></header>

    <main class="max-w-7xl mx-auto px-6 py-10">
        
        <div class="mb-8">
            <a href="javascript:history.back()" class="back-btn">← Назад</a>
            <div class="breadcrumbs mt-4">
                <a href="index.html">Главная</a> / <span>Магазины</span>
            </div>
        </div>

        <div class="bg-white rounded-3xl shadow-sm border p-8 md:p-12">
            <h1 class="text-4xl font-black text-slate-900 mb-4">Наши шоурумы</h1>
            <p class="text-gray-500 mb-10 text-lg">Здесь вы можете найти адреса наших филиалов и посмотреть доступный ассортимент.</p>

            <div id="stores-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="animate-pulse flex space-x-4">
                    <div class="flex-1 space-y-4 py-1">
                        <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                        <div class="space-y-2">
                            <div class="h-4 bg-gray-200 rounded"></div>
                            <div class="h-4 bg-gray-200 rounded w-5/6"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="auth-ui.js"></script>

  <script>
    async function loadStores() {
        const res = await fetch("http://localhost:5000/api/stores");
        const stores = await res.json();
        const container = document.getElementById('stores-container');
        
        container.innerHTML = stores.map(store => `
            <div class="border rounded-2xl p-6 bg-white shadow-sm hover:shadow-md transition">
                <img src="${store.image || 'https://via.placeholder.com/400x200'}" class="w-full h-40 object-cover rounded-xl mb-4">
                <h3 class="text-xl font-bold mb-2">${store.name}</h3>
                <p class="text-gray-500 text-sm mb-4">${store.address || 'Адрес уточняется'}</p>
                <a href="catalog.html" class="text-blue-600 font-bold">Перейти в каталог →</a>
            </div>
        `).join('');
    }
    document.addEventListener('DOMContentLoaded', () => {
        syncAuthUI();
        loadStores();
    });
</script>
</body>
</html>
