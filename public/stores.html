<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Наши магазины | Invisible Loft</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

    <header id="header-placeholder"></header>

    <main class="max-w-7xl mx-auto px-6 py-10">
        
        <div class="mb-8">
            <a href="javascript:history.back()" class="back-btn">← Назад</a>
            <div class="breadcrumbs mt-4">
                <a href="index.html">Главная</a> / <span>Магазины</span>
            </div>
        </div>

        <div class="bg-white rounded-3xl shadow-sm border p-8 md:p-12">
            <h1 class="text-4xl font-black text-slate-900 mb-4">Наши шоурумы</h1>
            <p class="text-gray-500 mb-10 text-lg">Выберите город, чтобы увидеть адрес и режим работы наших филиалов.</p>

            <div id="stores-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="animate-pulse flex space-x-4">
                    <div class="flex-1 space-y-4 py-1">
                        <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                        <div class="space-y-2">
                            <div class="h-4 bg-gray-200 rounded"></div>
                            <div class="h-4 bg-gray-200 rounded w-5/6"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="auth-ui.js"></script>

    <script>
        const API = "http://localhost:5000/api";

        async function loadStores() {
            try {
                const res = await fetch(`${API}/stores`);
                const stores = await res.json();
                renderStores(stores);
            } catch (e) {
                console.error("Ошибка загрузки магазинов:", e);
                document.getElementById('stores-container').innerHTML = `
                    <p class="text-red-500">Не удалось загрузить список магазинов. Проверьте работу сервера.</p>
                `;
            }
        }

        function renderStores(stores) {
            const container = document.getElementById('stores-container');
            
            if (stores.length === 0) {
                container.innerHTML = "<p class='text-gray-400'>Список магазинов пока пуст.</p>";
                return;
            }

            container.innerHTML = stores.map(store => `
                <div class="group p-6 border rounded-2xl hover:border-blue-500 hover:shadow-md transition duration-300 bg-gray-50">
                    <div class="flex items-start justify-between mb-4">
                        <div class="bg-blue-100 text-blue-600 p-3 rounded-xl">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                        </div>
                        <span class="text-xs font-bold text-green-600 bg-green-50 px-2 py-1 rounded">Открыто</span>
                    </div>
                    <h3 class="text-xl font-bold text-slate-900 mb-2">${store.name}</h3>
                    <p class="text-gray-600 text-sm mb-4">Адрес и детали уточняйте у менеджера при оформлении заказа в каталоге.</p>
                    <a href="catalog.html" class="inline-block text-blue-600 font-bold text-sm hover:underline">
                        Посмотреть двери в этом городе →
                    </a>
                </div>
            `).join('');
        }

        // Запуск
        loadStores();
    </script>
</body>
</html>
