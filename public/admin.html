<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ Центр | Invisible Loft</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .admin-table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .admin-table th { background: #f8fafc; padding: 12px 16px; text-align: left; font-size: 11px; font-weight: bold; color: #64748b; border-bottom: 2px solid #edf2f7; }
        .admin-table td { padding: 10px 16px; border-bottom: 1px solid #edf2f7; font-size: 13px; color: #334155; }
        .admin-table tr:hover { background-color: #f1f5f9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        input, select { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 10px; outline: none; font-size: 14px; }
        input:focus { border-color: #3b82f6; }
    </style>
</head>
<body class="bg-gray-100 flex">

    <aside class="w-64 bg-slate-900 text-white min-h-screen p-6 flex flex-col fixed left-0 top-0 h-full">
        <h2 class="font-bold text-xl mb-10 text-blue-400 tracking-widest text-center">ADMIN</h2>
        <div class="space-y-2 flex-grow">
            <button onclick="view('users')" class="block w-full text-left p-3 hover:bg-slate-800 rounded-xl transition">👤 Пользователи</button>
            <button onclick="view('doors')" class="block w-full text-left p-3 hover:bg-slate-800 rounded-xl transition">🚪 Двери</button>
            <button onclick="view('stores')" class="block w-full text-left p-3 hover:bg-slate-800 rounded-xl transition">🏪 Магазины</button>
            <button onclick="view('storages')" class="block w-full text-left p-3 hover:bg-slate-800 rounded-xl transition">📦 Склады</button>
            <button onclick="view('orders')" class="block w-full text-left p-3 hover:bg-slate-800 rounded-xl transition">📄 Заказы</button>
        </div>
        <div class="mt-auto pt-6 border-t border-slate-700 text-center">
            <a href="index.html" class="inline-block p-2 text-xs text-gray-400 hover:text-white transition">← Вернуться на сайт</a>
        </div>
    </aside>

    <main class="flex-grow p-10 ml-64">
        <div class="flex justify-between items-center mb-8">
            <h1 id="view-title" class="text-3xl font-black text-slate-800">Выберите раздел</h1>
            <button id="add-btn" onclick="openCreateModal()" class="hidden bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-xl font-bold transition shadow-lg">
                + Добавить запись
            </button>
        </div>
        <div id="content" class="overflow-x-auto"></div>
    </main>

    <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl">
            <h3 id="modal-title" class="text-xl font-bold mb-6">Создать запись</h3>
            <form id="modal-form" class="space-y-4">
                <div id="modal-fields" class="space-y-4"></div>
                <div class="flex gap-3 mt-8">
                    <button type="button" onclick="closeModal()" class="flex-1 py-3 bg-gray-100 rounded-xl font-bold">Отмена</button>
                    <button id="modal-submit-btn" type="submit" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API = "http://localhost:5000/api";
        let currentType = '';
        let editId = null; // Если не null, значит мы редактируем

        async function view(type) {
            currentType = type;
            document.getElementById('view-title').innerText = "Управление: " + type;
            document.getElementById('add-btn').classList.toggle('hidden', type === 'orders');
            
            const res = await fetch(`${API}/${type}`, {
                headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
            });
            const data = await res.json();
            renderTable(type, data);
        }

        function renderTable(type, data) {
            const container = document.getElementById('content');
            if (!data || data.length === 0) {
                container.innerHTML = "<p class='p-8 bg-white rounded-xl border text-center text-gray-500'>Данных нет.</p>";
                return;
            }

            const headers = Object.keys(data[0]).filter(k => !['password', 'updatedAt'].includes(k));
            let html = `<table class="admin-table"><thead><tr>${headers.map(h => `<th>${h.toUpperCase()}</th>`).join('')}<th class="text-right">ДЕЙСТВИЯ</th></tr></thead><tbody>`;

            data.forEach(row => {
                html += `<tr>`;
                headers.forEach(key => {
                    let val = row[key];
                    let display = val;
                    if (val && typeof val === 'object') display = val.name || 'ID: ' + val.id;
                    else if (typeof val === 'string' && (val.startsWith('http') || val.includes('/uploads/'))) {
                        display = `<img src="${val}" class="w-10 h-10 object-cover rounded border">`;
                    }
                    html += `<td>${display || '—'}</td>`;
                });
                html += `
                    <td class="text-right whitespace-nowrap">
                        <button onclick='openEditModal(${JSON.stringify(row)})' class="text-blue-500 hover:underline mr-3">Изм.</button>
                        <button onclick="del('${type}', ${row.id})" class="text-red-500 hover:underline">Удал.</button>
                    </td></tr>`;
            });
            container.innerHTML = html + `</tbody></table>`;
        }

        function openCreateModal() {
            editId = null;
            document.getElementById('modal-title').innerText = "Новая запись";
            setupFields();
            document.getElementById('modal').classList.replace('hidden', 'flex');
        }

        function openEditModal(data) {
            editId = data.id;
            document.getElementById('modal-title').innerText = "Редактировать #" + editId;
            setupFields(data);
            document.getElementById('modal').classList.replace('hidden', 'flex');
        }

        function setupFields(data = {}) {
            let fieldsHtml = '';
            if (currentType === 'doors') {
                fieldsHtml = `
                    <input id="f-name" value="${data.name || ''}" placeholder="Название" required>
                    <select id="f-doortype">
                        <option value="Скрытая" ${data.doorType === 'Скрытая' ? 'selected' : ''}>Скрытая</option>
                        <option value="Межкомнатная" ${data.doorType === 'Межкомнатная' ? 'selected' : ''}>Межкомнатная</option>
                        <option value="Входная" ${data.doorType === 'Входная' ? 'selected' : ''}>Входная</option>
                    </select>
                    <input id="f-price" type="number" value="${data.price || ''}" placeholder="Цена" required>
                    <input id="f-material" value="${data.material || ''}" placeholder="URL картинки">
                `;
            } else {
                fieldsHtml = `<input id="f-name" value="${data.name || ''}" placeholder="Название" required>`;
            }
            document.getElementById('modal-fields').innerHTML = fieldsHtml;
        }

        document.getElementById('modal-form').onsubmit = async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('modal-submit-btn');
            submitBtn.disabled = true;

            let body = { name: document.getElementById('f-name').value };
            if (currentType === 'doors') {
                body = { 
                    ...body,
                    doorType: document.getElementById('f-doortype').value,
                    price: document.getElementById('f-price').value,
                    material: document.getElementById('f-material').value,
                    storeId: 1, storageId: 1 
                };
            }

            const method = editId ? 'PUT' : 'POST';
            const url = editId ? `${API}/${currentType}/${editId}` : `${API}/${currentType}`;

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(body)
                });

                if (res.ok) {
                    closeModal();
                    view(currentType);
                } else {
                    alert("Ошибка при сохранении");
                }
            } catch (e) {
                alert("Ошибка сети");
            } finally {
                submitBtn.disabled = false;
            }
        };

        function closeModal() { document.getElementById('modal').classList.replace('flex', 'hidden'); }

        async function del(type, id) {
            if(!confirm('Удалить?')) return;
            await fetch(`${API}/${type}/${id}`, { 
                method: 'DELETE', 
                headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } 
            });
            view(type);
        }
    </script>
</body>
</html>
