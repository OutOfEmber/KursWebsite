<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель | Invisible Loft</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="flex">
        <div class="w-64 bg-white h-screen shadow-lg p-6 fixed">
            <div class="font-bold text-xl mb-10 text-blue-600 uppercase tracking-widest">Admin Panel</div>
            <nav class="space-y-2">
                <button onclick="loadData('doors')" class="nav-btn w-full text-left p-3 hover:bg-blue-50 rounded-xl transition flex items-center gap-3"><span>🚪</span> Двери</button>
                <button onclick="loadData('stores')" class="nav-btn w-full text-left p-3 hover:bg-blue-50 rounded-xl transition flex items-center gap-3"><span>🏪</span> Магазины</button>
                <button onclick="loadData('storages')" class="nav-btn w-full text-left p-3 hover:bg-blue-50 rounded-xl transition flex items-center gap-3"><span>📦</span> Склады</button>
                <button onclick="loadData('orders')" class="nav-btn w-full text-left p-3 hover:bg-blue-50 rounded-xl transition flex items-center gap-3"><span>📜</span> Заказы</button>
                <a href="index.html" class="block w-full text-left p-3 text-red-500 mt-10 font-bold">← На сайт</a>
            </nav>
        </div>

        <div class="ml-64 p-10 w-full">
            <div class="flex justify-between items-center mb-8">
                <h1 id="table-title" class="text-3xl font-black text-slate-900">Выберите раздел</h1>
                <button id="add-btn" onclick="openModal()" class="hidden bg-blue-600 text-white px-6 py-3 rounded-xl font-bold hover:shadow-lg transition transform active:scale-95">+ Добавить запись</button>
            </div>

            <div class="bg-white rounded-[2.5rem] shadow-sm border border-gray-100 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead id="table-head" class="bg-gray-50 text-gray-400 text-xs uppercase font-bold"></thead>
                    <tbody id="table-body" class="divide-y divide-gray-100 text-sm"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center backdrop-blur-sm z-50 p-4">
        <div class="bg-white p-8 rounded-[2.5rem] w-full max-w-lg shadow-2xl">
            <h2 id="modal-title" class="text-2xl font-black mb-6">Редактирование</h2>
            <div id="modal-fields" class="space-y-4">
                </div>
            <div class="flex gap-4 mt-8">
                <button onclick="save()" class="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-bold hover:bg-blue-700 transition">Сохранить</button>
                <button onclick="closeModal()" class="flex-1 bg-gray-100 text-gray-500 py-4 rounded-2xl font-bold">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:5000/api';
        let currentType = '';
        let currentId = null;

        // 1. Загрузка данных
        async function loadData(type) {
            currentType = type;
            document.getElementById('table-title').innerText = `Управление: ${type}`;
            
            // Управляем видимостью кнопки "Добавить"
            const addBtn = document.getElementById('add-btn');
            addBtn.classList.remove('hidden');
            if (type === 'orders') addBtn.classList.add('hidden'); // Заказы создаются только клиентами

            try {
                const res = await fetch(`${API}/${type}`);
                const data = await res.json();
                renderTable(data);
            } catch (e) {
                console.error("Ошибка загрузки:", e);
            }
        }

        // 2. Отрисовка таблицы с кнопками "Изм." и "Удал."
        function renderTable(data) {
            const head = document.getElementById('table-head');
            const body = document.getElementById('table-body');
            head.innerHTML = '';
            body.innerHTML = '';

            if (data.length === 0) {
                body.innerHTML = '<tr><td class="p-10 text-center text-gray-400">Данных пока нет</td></tr>';
                return;
            }

            const keys = Object.keys(data[0]).filter(k => !['updatedAt', 'createdAt'].includes(k));
            
            // Шапка
            let headHtml = '<tr>';
            keys.forEach(key => headHtml += `<th class="p-5">${key}</th>`);
            headHtml += '<th class="p-5 text-right">Действия</th></tr>';
            head.innerHTML = headHtml;

            // Строки
            data.forEach(item => {
                let rowHtml = `<tr class="hover:bg-blue-50/30 transition">`;
                keys.forEach(key => {
                    let val = item[key];
                    if (key === 'image' && val) {
                        rowHtml += `<td class="p-5"><img src="${val}" class="w-12 h-12 object-cover rounded-lg"></td>`;
                    } else if (typeof val === 'object' && val !== null) {
                        rowHtml += `<td class="p-5 text-blue-600 font-medium">${val.name || '—'}</td>`;
                    } else {
                        rowHtml += `<td class="p-5 text-gray-600 font-medium">${val || '—'}</td>`;
                    }
                });

                // Кнопки Изменить и Удалить (сохранены из вашего прошлого кода)
                rowHtml += `
                    <td class="p-5 text-right space-x-3">
                        <button onclick="openModal('${item.id}')" class="text-blue-500 font-bold hover:underline">Изм.</button>
                        <button onclick="removeItem('${item.id}')" class="text-red-500 font-bold hover:underline">Удал.</button>
                    </td>
                </tr>`;
                body.innerHTML += rowHtml;
            });
        }

        // 3. Модальное окно с ВЫБОРКОЙ вместо ручного ввода
        async function openModal(id = null) {
            currentId = id;
            const modal = document.getElementById('modal');
            const fields = document.getElementById('modal-fields');
            const title = document.getElementById('modal-title');
            
            fields.innerHTML = '';
            modal.classList.remove('hidden');
            title.innerText = id ? 'Редактирование записи' : 'Добавление новой записи';

            let item = {};
            if (id) {
                const res = await fetch(`${API}/${currentType}`);
                const data = await res.json();
                item = data.find(i => i.id == id);
            }

            // Динамическая генерация полей с выборками (Select)
            if (currentType === 'doors') {
                fields.innerHTML = `
                    <input id="f_name" value="${item.name || ''}" placeholder="Название" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none">
                    
                    <label class="block text-xs font-bold text-gray-400 px-2">ТИП ДВЕРИ</label>
                    <select id="f_doorType" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none">
                        <option value="Скрытая" ${item.doorType === 'Скрытая' ? 'selected' : ''}>Скрытая</option>
                        <option value="Классика" ${item.doorType === 'Классика' ? 'selected' : ''}>Классика</option>
                        <option value="Раздвижная" ${item.doorType === 'Раздвижная' ? 'selected' : ''}>Раздвижная</option>
                        <option value="Loft" ${item.doorType === 'Loft' ? 'selected' : ''}>Loft</option>
                    </select>

                    <label class="block text-xs font-bold text-gray-400 px-2">МАТЕРИАЛ</label>
                    <select id="f_material" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none">
                        <option value="МДФ" ${item.material === 'МДФ' ? 'selected' : ''}>МДФ</option>
                        <option value="Эмаль" ${item.material === 'Эмаль' ? 'selected' : ''}>Эмаль</option>
                        <option value="Шпон" ${item.material === 'Шпон' ? 'selected' : ''}>Шпон</option>
                        <option value="Массив" ${item.material === 'Массив' ? 'selected' : ''}>Массив</option>
                    </select>

                    <input id="f_price" value="${item.price || ''}" type="number" placeholder="Цена" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none">
                    <input id="f_image" value="${item.image || ''}" placeholder="Ссылка на картинку" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none">
                    <input id="f_storeId" value="${item.storeId || ''}" placeholder="ID магазина" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none">
                    <input id="f_storageId" value="${item.storageId || ''}" placeholder="ID склада" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none">
                `;
            } else if (currentType === 'orders') {
                fields.innerHTML = `
                    <label class="block text-xs font-bold text-gray-400 px-2">СТАТУС ЗАКАЗА</label>
                    <select id="f_status" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none">
                        <option value="Новый" ${item.status === 'Новый' ? 'selected' : ''}>Новый</option>
                        <option value="Оплачен" ${item.status === 'Оплачен' ? 'selected' : ''}>Оплачен</option>
                        <option value="В доставке" ${item.status === 'В доставке' ? 'selected' : ''}>В доставке</option>
                        <option value="Доставлен" ${item.status === 'Доставлен' ? 'selected' : ''}>Доставлен</option>
                    </select>
                    <input id="f_comment" value="${item.comment || ''}" placeholder="Комментарий" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none">
                `;
            } else if (currentType === 'stores' || currentType === 'storages') {
                fields.innerHTML = `
                    <input id="f_name" value="${item.name || ''}" placeholder="Название" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none">
                    <input id="f_address" value="${item.address || ''}" placeholder="Адрес" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none">
                    <input id="f_image" value="${item.image || ''}" placeholder="Ссылка на фото" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none">
                `;
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        // 4. Сохранение (POST или PUT)
        async function save() {
            const data = {};
            const inputs = document.querySelectorAll('#modal-fields input, #modal-fields select');
            
            inputs.forEach(input => {
                const key = input.id.replace('f_', '');
                data[key] = input.value;
            });

            const method = currentId ? 'PUT' : 'POST';
            const url = currentId ? `${API}/${currentType}/${currentId}` : `${API}/${currentType}`;

            try {
                const res = await fetch(url, {
                    method,
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}` // Добавлена авторизация
                    },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    closeModal();
                    loadData(currentType);
                } else {
                    const err = await res.json();
                    alert("Ошибка: " + (err.error || "не удалось сохранить"));
                }
            } catch (e) {
                alert("Ошибка соединения с сервером");
            }
        }

        // 5. Удаление
        async function removeItem(id) {
            if (confirm('Удалить эту запись безвозвратно?')) {
                try {
                    const res = await fetch(`${API}/${currentType}/${id}`, { 
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                    });
                    if (res.ok) loadData(currentType);
                } catch (e) {
                    alert("Ошибка удаления");
                }
            }
        }
    </script>
</body>
</html>
