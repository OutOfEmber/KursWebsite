<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Корзина | Invisible Loft</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

    <header class="bg-white border-b py-4 px-6 flex justify-between items-center sticky top-0 z-50">
        <div class="font-black text-2xl tracking-tighter cursor-pointer" onclick="location.href='index.html'">
            INVISIBLE <span class="text-blue-600">LOFT</span>
        </div>
        <nav class="flex items-center gap-6 font-medium text-sm">
            <a href="index.html">Главная</a>
            <a href="catalog.html">Каталог</a>
            <a href="stores.html">Магазины</a>
            <a href="cart.html" class="text-blue-600 relative">🛒 Корзина <span id="cart-count" class="bg-red-500 text-white text-[10px] rounded-full px-1.5 absolute -top-2 -right-3">0</span></a>
            <a href="admin.html" id="adm-link" class="hidden text-blue-600 font-bold border-l pl-6">Админка</a>
            <a href="login.html" id="login-link" class="bg-slate-900 text-white px-5 py-2.5 rounded-xl">Вход</a>
            <button onclick="logout()" id="logout-btn" class="hidden text-red-500">Выйти</button>
        </nav>
    </header>

    <main class="max-w-6xl mx-auto p-6 md:p-12">
        <h1 class="text-4xl font-black mb-10">Корзина</h1>

        <div class="cart-container">
            <div id="cart-items">
                </div>

            <aside class="checkout-panel">
                <h2 class="text-xl font-bold mb-6">Итого</h2>
                <div class="flex justify-between mb-4 text-gray-500">
                    <span>Товары (<span id="total-qty">0</span>)</span>
                    <span id="subtotal">0 ₽</span>
                </div>
                <div class="border-t pt-4 mb-8">
                    <div class="flex justify-between items-end">
                        <span class="font-bold">К оплате</span>
                        <span id="final-price" class="text-3xl font-black text-blue-600">0 ₽</span>
                    </div>
                </div>
                <button onclick="checkout()" id="checkout-btn" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-bold hover:bg-blue-600 transition-all shadow-lg active:scale-95">
                    Оформить заказ
                </button>
            </aside>
        </div>
    </main>

    <script src="auth-ui.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!localStorage.getItem('token')) {
                alert("Пожалуйста, войдите в аккаунт");
                window.location.href = 'login.html';
                return;
            }
            renderCart();
        });

        function renderCart() {
            const container = document.getElementById('cart-items');
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            
            // Синхронизация счетчиков
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('total-qty').innerText = cart.length;

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-20 rounded-[32px] text-center border border-dashed">
                        <p class="text-gray-400 mb-6">Корзина пуста</p>
                        <a href="catalog.html" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold">В каталог</a>
                    </div>`;
                updateTotal(0);
                return;
            }

            let total = 0;
            container.innerHTML = cart.map((item, index) => {
                total += Number(item.price);
                return `
                <div class="cart-item">
                    <img src="${item.image}" class="cart-item-img" onerror="this.src='https://via.placeholder.com/100'">
                    <div class="cart-item-info">
                        <div class="cart-item-title">${item.name}</div>
                        <div class="cart-item-price">${Number(item.price).toLocaleString()} ₽</div>
                    </div>
                    <div class="cart-item-remove" onclick="removeFromCart(${index})">✕</div>
                </div>`;
            }).join('');

            updateTotal(total);
        }

        function updateTotal(total) {
            const priceStr = `${total.toLocaleString()} ₽`;
            document.getElementById('subtotal').innerText = priceStr;
            document.getElementById('final-price').innerText = priceStr;
            
            const btn = document.getElementById('checkout-btn');
            btn.disabled = total === 0;
            btn.style.opacity = total === 0 ? '0.5' : '1';
        }

        function removeFromCart(index) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
            if(window.syncAuthUI) syncAuthUI(); // Обновить шапку
        }

        async function checkout() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            if(cart.length === 0) return;
            
            // Здесь логика отправки на сервер (как делали раньше)
            alert("Заказ принят в обработку!");
            localStorage.setItem('cart', '[]');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
