<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог дверей | Invisible Loft</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50">

    <header>
        <div class="logo font-bold text-2xl">INVISIBLE <span class="text-blue-600">LOFT</span></div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="catalog.html" class="text-blue-600">Каталог</a>
            <a href="stores.html">Магазины</a>
            <a href="about.html">О нас</a>
            <a href="cart.html" class="relative">
                <i class="fa-solid fa-cart-shopping"></i> 
                <span id="cart-count" class="bg-red-500 text-white text-[10px] rounded-full px-1.5 absolute -top-2 -right-3">0</span>
            </a>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-black">Все двери</h1>
            <div class="flex gap-4">
                <input type="text" id="search" placeholder="Поиск по названию..." class="p-2 border rounded-lg w-64" oninput="filterDoors()">
            </div>
        </div>

        <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
            <p class="text-gray-500">Загрузка товаров...</p>
        </div>
    </main>
    <script src="auth-ui.js"></script>
    <script>
        const API = "http://localhost:5000/api";
        let allDoors = []; // Храним тут все двери для фильтрации

        // 1. Загрузка данных с сервера
        async function loadDoors() {
            try {
                const res = await fetch(`${API}/doors`);
                allDoors = await res.json();
                renderDoors(allDoors);
            } catch (e) {
                document.getElementById('catalog-grid').innerHTML = "Ошибка связи с сервером";
            }
        }

        // 2. Отрисовка карточек
        function renderDoors(doors) {
            const grid = document.getElementById('catalog-grid');
            if (doors.length === 0) {
                grid.innerHTML = "<p>Ничего не найдено</p>";
                return;
            }

            grid.innerHTML = doors.map(door => `
                <div class="card bg-white rounded-xl shadow-sm border p-4 flex flex-col justify-between">
                    <div>
                        <img src="${door.material || 'https://via.placeholder.com/300x400'}" class="w-full h-64 object-cover rounded-lg mb-4">
                        <h3 class="font-bold text-lg leading-tight mb-1">${door.name}</h3>
                        <p class="text-gray-400 text-sm mb-3">Материал: МДФ / Скрытый короб</p>
                    </div>
                    <div>
                        <div class="text-2xl font-black text-blue-600 mb-4">${door.price} ₽</div>
                        <button onclick="addToCart(${door.id}, '${door.name}', ${door.price}, '${door.material}')" 
                                class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold hover:bg-blue-600 transition duration-300">
                            В корзину
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 3. Функция КОРЗИНЫ
        function addToCart(id, name, price, image) {
            // Получаем массив из localStorage
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            
            // Добавляем объект товара
            cart.push({ id, name, price, image });
            
            // Сохраняем обратно
            localStorage.setItem('cart', JSON.stringify(cart));
            
            // Обновляем визуальный счетчик
            updateCartCounter();
            
            // Маленькое уведомление
            alert(`Товар "${name}" добавлен!`);
        }

        function updateCartCounter() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            document.getElementById('cart-count').innerText = cart.length;
        }

        function filterDoors() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = allDoors.filter(d => d.name.toLowerCase().includes(query));
            renderDoors(filtered);
        }

        // Запуск при старте
        loadDoors();
        updateCartCounter();
    </script>
</body>
</html>
