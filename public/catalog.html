<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог | Invisible Loft</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50">

    <header class="main-header">
        <div class="logo" onclick="location.href='index.html'">INVISIBLE <span>LOFT</span></div>
        <nav class="nav-menu">
            <a href="index.html" class="nav-link active">Главная</a>
            <a href="catalog.html" class="nav-link">Каталог</a>
            <a href="stores.html" class="nav-link">Магазины</a>
            <a href="about.html" class="nav-link">О нас</a>
            <a href="cart.html" class="nav-link relative">
                🛒 Корзина <span id="cart-count" class="bg-red-500 text-white text-[10px] rounded-full px-1.5 absolute -top-2 -right-3">0</span>
            </a>
            <a href="orders.html" id="orders-link" class="nav-link" style="display:none">Мои заказы</a>
            <a href="admin.html" id="adm-link" class="nav-link admin hidden">Админка</a>
            <a href="login.html" id="login-link" class="nav-link">Вход</a>
            <a href="#" id="logout-btn" onclick="logout()" class="nav-link logout" style="display:none">Выйти</a>
        </nav>
    </header>

    <nav class="breadcrumbs">
        <a href="index.html">Главная</a>
        <span>Каталог</span>
    </nav>

    <div class="catalog-content">
        <aside class="filters-panel">
            <h2 class="text-xl font-black mb-6">Фильтры</h2>
            <div class="filter-section">
                <label class="filter-label">Поиск по названию</label>
                <input type="text" id="searchName" oninput="applyFilters()" class="filter-input-text" placeholder="Введите название...">
            </div>
            <div class="filter-section">
                <label class="filter-label">Тип двери</label>
                <select id="filterType" onchange="applyFilters()" class="filter-select">
                    <option value="all">Все типы</option>
                    <option value="Скрытая">Скрытая</option>
                    <option value="Классика">Классика</option>
                    <option value="Loft">Loft</option>
                </select>
            </div>
            <div class="filter-section">
                <label class="filter-label">Материал</label>
                <select id="filterMaterial" onchange="applyFilters()" class="filter-select">
                    <option value="all">Любой материал</option>
                    <option value="МДФ">МДФ</option>
                    <option value="Эмаль">Эмаль</option>
                    <option value="Шпон">Шпон</option>
                    <option value="Массив">Массив</option>
                </select>
            </div>
            <div class="filter-section">
                <label class="filter-label">Максимальная цена</label>
                <input type="number" id="filterPrice" oninput="applyFilters()" class="filter-input-text" placeholder="Цена до...">
            </div>
            <button class="btn-reset w-full mt-4 py-2 border border-dashed border-gray-300 rounded-xl text-gray-400 hover:text-blue-600 transition" onclick="resetFilters()">
                Сбросить фильтры
            </button>
        </aside>

        <main id="doors-grid" class="doors-grid"></main>
    </div>

    <script>
        const API_URL = "http://localhost:5000/api";
        let allDoors = [];

        // Синхронизация кнопок входа/выхода
        function syncAuthUI() {
            const role = localStorage.getItem('role');
            const loginLink = document.getElementById('login-link');
            const admLink = document.getElementById('adm-link');
            const logoutBtn = document.getElementById('logout-btn');
            const ordersLink = document.getElementById('orders-link');

            if (role) {
                if (loginLink) loginLink.style.display = 'none';
                if (logoutBtn) logoutBtn.style.display = 'block';
                if (ordersLink) ordersLink.style.display = 'block';
                if (role === 'ADMIN' && admLink) {
                    admLink.classList.remove('hidden');
                    admLink.style.display = 'block';
                }
            } else {
                if (loginLink) loginLink.style.display = 'block';
                if (admLink) admLink.style.display = 'none';
                if (logoutBtn) logoutBtn.style.display = 'none';
            }
        }

        async function loadDoors() {
    const container = document.getElementById('catalog-items');
    
    // 1. Получаем storeId из URL (если он есть)
    const urlParams = new URLSearchParams(window.location.search);
    const filterStoreId = urlParams.get('storeId');

    try {
        const res = await fetch("http://localhost:5000/api/doors");
        let doors = await res.json();

        // 2. ГЛОБАЛЬНАЯ ФИЛЬТРАЦИЯ ПО МАГАЗИНУ
        if (filterStoreId) {
            // Оставляем только те двери, у которых storeId в базе совпадает с переданным
            doors = doors.filter(door => String(door.storeId) === String(filterStoreId));
            
            // Меняем заголовок страницы, чтобы было понятно
            const titleEl = document.querySelector('h1');
            if (titleEl) titleEl.innerText = "Товары этого магазина";
            
            // Можно добавить кнопку "Показать всё"
            const filterGrid = document.querySelector('.flex.flex-wrap'); // твой блок с фильтрами
            if (filterGrid && !document.getElementById('reset-store-btn')) {
                const resetBtn = document.createElement('button');
                resetBtn.id = 'reset-store-btn';
                resetBtn.className = "bg-red-50 text-red-500 px-6 py-4 rounded-2xl font-bold text-sm hover:bg-red-500 hover:text-white transition";
                resetBtn.innerText = "✕ Сбросить магазин";
                resetBtn.onclick = () => window.location.href = 'catalog.html';
                filterGrid.appendChild(resetBtn);
            }
        }

        allDoors = doors; // Сохраняем отфильтрованный список для работы других фильтров
        renderDoors(allDoors);
        
    } catch (e) {
        console.error("Ошибка:", e);
        container.innerHTML = "<p class='text-center py-20 text-red-500 font-bold'>Ошибка связи с сервером</p>";
    }
}

        function renderDoors(doors) {
            const container = document.getElementById('doors-grid');
            container.innerHTML = '';
            if (doors.length === 0) {
                container.innerHTML = '<p class="col-span-full text-center text-gray-400 py-20">Ничего не найдено</p>';
                return;
            }
            doors.forEach(door => {
                const card = document.createElement('div');
                card.className = 'door-card';
                card.innerHTML = `
                    <div class="door-img-wrapper"><img src="${door.image}" alt="${door.name}"></div>
                    <div class="door-details">
                        <h3 class="door-title">${door.name}</h3>
                        <p class="door-info-line">${door.doorType} • ${door.material}</p>
                        <div class="door-price-row">${Number(door.price).toLocaleString()} ₽</div>
                        <button class="btn-buy" onclick="addToCart(${door.id}, '${door.name}', ${door.price}, '${door.image}')">В корзину</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function applyFilters() {
            const nameQuery = document.getElementById('searchName').value.toLowerCase();
            const typeQuery = document.getElementById('filterType').value;
            const matQuery = document.getElementById('filterMaterial').value;
            const maxPrice = Number(document.getElementById('filterPrice').value) || Infinity;

            const filtered = allDoors.filter(door => {
                const matchesName = door.name.toLowerCase().includes(nameQuery);
                const matchesType = typeQuery === 'all' || door.doorType === typeQuery;
                const matchesMat = matQuery === 'all' || door.material === matQuery;
                const matchesPrice = Number(door.price) <= maxPrice;
                return matchesName && matchesType && matchesMat && matchesPrice;
            });
            renderDoors(filtered);
        }

        function resetFilters() {
            document.getElementById('searchName').value = '';
            document.getElementById('filterType').value = 'all';
            document.getElementById('filterMaterial').value = 'all';
            document.getElementById('filterPrice').value = '';
            renderDoors(allDoors);
        }

        // ОБНОВЛЕННАЯ ФУНКЦИЯ ДОБАВЛЕНИЯ (С проверкой авторизации)
        function addToCart(id, name, price, image) {
            const role = localStorage.getItem('role');
            
            if (!role) {
                alert("Чтобы добавить товар в корзину, необходимо войти в аккаунт");
                window.location.href = 'login.html';
                return;
            }

            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            cart.push({ id, name, price, image });
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            console.log(`"${name}" добавлена в корзину`);
        }

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const countEl = document.getElementById('cart-count');
            if (countEl) countEl.innerText = cart.length;
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            syncAuthUI();
            updateCartCount();
            loadDoors();
        });
    </script>
</body>
</html>
